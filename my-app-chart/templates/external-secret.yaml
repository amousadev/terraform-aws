# 1. The Store: Tells K8s how to log in to AWS (using the IAM Role)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: app-service-account
---
# 2. The Sync: Tells K8s which secret to fetch
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-secret-sync
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: app-secrets # The name of the K8s secret to be created
  data:
  - secretKey: password # Key inside K8s
    remoteRef:
      key: {{ .Values.awsSecretName }} # Key inside AWS
      property: password