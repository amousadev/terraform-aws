version: 0.2

phases:
  install:
    commands:
      # The terraform image already has terraform installed
      - terraform --version
  pre_build:
    commands:
      - echo "Initializing Terraform..."
      # -input=false ensures the build doesn't hang waiting for user input
      - terraform init -input=false
  build:
    commands:
      - echo "Running Terraform Plan..."
      - terraform plan -input=false
      # Uncomment the next line if you want the pipeline to automatically apply
      # - terraform apply -auto-approve -input=false

artifacts:
  files:
    - '**/*' # Optional: passes all files to the next stage if needed
